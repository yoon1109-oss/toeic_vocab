<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>현재 앱 UI — 정확한 재현</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── 기기 프레임 ── */
  body {
    background: #CBD5E1;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 20px;
    gap: 40px;
    flex-wrap: wrap;
    min-height: 100vh;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .phone-label {
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: #475569;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .phone-frame {
    width: 375px;
    background: #F0F9FF;  /* surfaceContainerLowest */
    border-radius: 40px;
    box-shadow:
      0 0 0 10px #1E293B,
      0 0 0 12px #334155,
      0 24px 48px rgba(0,0,0,0.35);
    overflow: hidden;
    position: relative;
  }

  /* 노치 */
  .notch {
    width: 120px;
    height: 28px;
    background: #1E293B;
    border-radius: 0 0 16px 16px;
    margin: 0 auto;
    position: relative;
    z-index: 10;
  }

  /* ── 앱 내부 ── */
  .app {
    background: #F0F9FF;
    min-height: 780px;
    display: flex;
    flex-direction: column;
    padding-bottom: 0;
  }

  /* ── AppBar ── */
  .app-bar {
    display: flex;
    align-items: center;
    padding: 12px 8px 8px;
    gap: 4px;
  }

  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 20px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #0C4A6E;
    flex-shrink: 0;
  }

  .app-bar-title {
    font-size: 18px;
    font-weight: 700;
    color: #0C4A6E;
  }

  /* ── Level Tab Bar ── */
  .level-tabs {
    margin: 4px 16px 0;
    background: #E0F2FE;  /* surfaceContainer */
    border-radius: 16px;
    padding: 4px;
    display: flex;
    gap: 0;
  }

  .tab {
    flex: 1;
    padding: 12px 0;
    border-radius: 12px;
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    color: #475569;
    cursor: pointer;
    border: none;
    background: transparent;
  }

  .tab.active {
    background: #0EA5E9;
    color: white;
    font-weight: 700;
    box-shadow: 0 2px 8px rgba(14,165,233,0.3);
  }
  .tab.active.lv2 { background: #0284C7; box-shadow: 0 2px 8px rgba(2,132,199,0.3); }
  .tab.active.lv3 { background: #0369A1; box-shadow: 0 2px 8px rgba(3,105,161,0.3); }

  /* ── Progress info ── */
  .progress-info {
    display: flex;
    justify-content: space-between;
    padding: 12px 24px 8px;
    font-size: 14px;
    color: #38BDF8;
  }

  /* ── Progress bar ── */
  .progress-bar-wrap {
    margin: 0 24px 8px;
    background: #E0F2FE;
    border-radius: 3px;
    height: 5px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 3px;
    background: #0284C7;
    transition: width 0.3s;
  }

  /* ── Word Card ── */
  .card-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 24px;
  }

  .word-card {
    width: 100%;
    background: #FFFFFF;
    border-radius: 24px;
    box-shadow: 0 4px 16px rgba(12,74,110,0.08);
    padding: 40px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  /* 진행 점 */
  .dots {
    display: flex;
    gap: 4px;
    margin-bottom: 36px;
  }
  .dot {
    height: 8px;
    border-radius: 4px;
    background: rgba(56,189,248,0.2);
    width: 8px;
  }
  .dot.active { width: 20px; background: #0284C7; }
  .dot.done   { background: #0284C7; }

  /* 영어 단어 */
  .word-en {
    font-size: 40px;
    font-weight: 700;
    color: #0C4A6E;
    letter-spacing: -0.5px;
    margin-bottom: 12px;
  }

  /* 발음 기호 */
  .phonetic {
    font-size: 20px;
    color: #475569;
    margin-bottom: 40px;
  }

  /* 한글 뜻 */
  .word-ko {
    font-size: 24px;
    color: rgba(12,74,110,0.85);
    line-height: 1.4;
    text-align: center;
    margin-bottom: 28px;
  }

  /* 발음 버튼 */
  .speak-btn {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: #E0F2FE;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 즐겨찾기 */
  .fav-btn {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: none;
    border: none;
    font-size: 30px;
    line-height: 1;
    cursor: pointer;
    padding: 8px;
    color: rgba(56,189,248,0.4);
  }
  .fav-btn.active { color: #FFD700; }

  /* ── Navigation Buttons ── */
  .nav-btns {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 24px;
    padding: 16px 24px 40px;
  }

  .btn-prev {
    width: 140px;
    height: 52px;
    border-radius: 26px;
    border: 1.5px solid #0284C7;
    background: transparent;
    color: #0284C7;
    font-size: 17px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .btn-prev.disabled {
    border-color: rgba(56,189,248,0.2);
    color: rgba(56,189,248,0.4);
  }

  .btn-next {
    width: 140px;
    height: 52px;
    border-radius: 26px;
    border: none;
    background: #0284C7;
    color: white;
    font-size: 17px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  /* 홈 인디케이터 */
  .home-indicator {
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F0F9FF;
  }
  .home-bar {
    width: 120px;
    height: 5px;
    background: #0C4A6E;
    border-radius: 3px;
    opacity: 0.2;
  }
</style>
</head>
<body>

<!-- ══ 화면 1: OPIc 초급 — abroad ══ -->
<div>
  <div class="phone-label">현재 앱 — OPIc 초급 · abroad</div>
  <div class="phone-frame">
    <div class="notch"></div>
    <div class="app">

      <!-- AppBar -->
      <div class="app-bar">
        <button class="icon-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0C4A6E" stroke-width="2.2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div style="width:4px"></div>
        <div class="app-bar-title">OPIc 단어</div>
      </div>

      <!-- Level Tabs -->
      <div class="level-tabs">
        <button class="tab active">초급</button>
        <button class="tab">중급</button>
        <button class="tab">고급</button>
      </div>

      <!-- Progress Info -->
      <div class="progress-info">
        <span>세트 1 / 25</span>
        <span>1 / 250</span>
      </div>

      <!-- Progress Bar -->
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" style="width: 0.4%"></div>
      </div>

      <!-- Word Card -->
      <div class="card-area">
        <div class="word-card">
          <!-- 진행 점 -->
          <div class="dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>

          <!-- 영어 단어 -->
          <div class="word-en">abroad</div>

          <!-- 발음 -->
          <div class="phonetic">əˈbrɔːd</div>

          <!-- 한글 뜻 -->
          <div class="word-ko">해외에, 외국에</div>

          <!-- 발음 버튼 -->
          <button class="speak-btn">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0284C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            </svg>
          </button>

          <!-- 즐겨찾기 -->
          <button class="fav-btn">☆</button>
        </div>
      </div>

      <!-- Nav Buttons -->
      <div class="nav-btns">
        <button class="btn-prev disabled">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          이전
        </button>
        <button class="btn-next">
          다음
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

      <div class="home-indicator"><div class="home-bar"></div></div>
    </div>
  </div>
</div>

<!-- ══ 화면 2: OPIc 초급 — advice · 즐겨찾기 ON ══ -->
<div>

      </div>

      <div class="level-tabs">

      <div class="progress-info">

      <div class="progress-bar-wrap">

      <div class="card-area">

          <div class="dots">
            <div class="dot done"></div>

            <div class="dot done"></div>
            <div class="dot done"></div>
            <div class="dot done"></div>
            <div class="dot done"></div>
            <div class="dot done"></div>
            <div class="dot done"></div>
            <div class="dot done"></div>
            <div class="dot done"></div>
            <div class="dot active"></div>
          </div>

          <div class="word-en">advice</div>
          <div class="phonetic">ədˈvaɪs</div>
          <div class="word-ko">충고, 조언</div>

          <button class="speak-btn">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0284C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>

      <div class="nav-btns">
        <button class="btn-prev">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>

        </button>
        <button class="btn-next">
          다음
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>

      <div class="home-indicator"><div class="home-bar"></div></div>
    </div>
  </div>
</div>

</body>
</html>
